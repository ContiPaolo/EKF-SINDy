[project]
name = "ekfsindy"
version = "0.2.0"
description = "Extended Kalman filter empowered with sparse identification of nonlinear dynamics (EKF-SINDy)"
readme = "README.md"
authors = [
    { name = "Paolo Conti" },
    { name = "Luca Rosafalco" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "jax>=0.4.30",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "pysindy==1.7.5",
    "scikit-learn==1.3.2",
    "scipy==1.13.1",
    # pysindy 1.7.5 imports pkg_resources, removed from newer setuptools
    "setuptools<81",
    "sympy>=1.12",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pyDOE==0.3.8",
]

[project.urls]
Homepage = "https://github.com/ContiPaolo/EKF-SINDy"

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
