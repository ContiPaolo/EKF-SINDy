[project]
name = "ekfsindy"
version = "0.2.0"
description = "Extended Kalman filter empowered with sparse identification of nonlinear dynamics (EKF-SINDy)"
readme = "README.md"
authors = [
    { name = "Paolo Conti" },
    { name = "Luca Rosafalco" },
]
requires-python = ">=3.10"
# Ranges, so that the package installs on top of preinstalled environments (e.g. Colab);
# exact versions for local development are pinned in uv.lock.
dependencies = [
    "jax>=0.4.30",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pysindy>=2.0,<3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/ContiPaolo/EKF-SINDy"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/legacy"]
